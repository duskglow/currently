# GoReleaser config for Currently releases: archives for every platform,
# Linux packages (deb, rpm, apk, Arch), a multi-arch container image,
# Homebrew and winget manifests, checksums, SBOMs and cosign signatures.
# The Windows MSI and FreeBSD package are built by the release workflow
# from these archives and attached to the release afterwards
# (packaging/windows, packaging/freebsd).
#
#   goreleaser release --snapshot --clean --skip=docker,sign,sbom   # local test build
#
# Releases run from .github/workflows/release.yml when a v* tag is pushed.
version: 2
project_name: currently

builds:
  - &build
    id: currently
    main: ./cmd/currently
    binary: currently
    env: [CGO_ENABLED=0]
    goos: [linux, windows, darwin, freebsd]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - { goos: windows, goarch: arm }
      - { goos: darwin, goarch: arm }
      - { goos: freebsd, goarch: arm }
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/duskglow/currently/internal/version.Version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
  - <<: *build
    id: mqtt
    main: ./plugins/mqtt
    # Plugins live in plugins/ next to the Currently executable.
    binary: plugins/currently-output-mqtt
    ldflags:
      - -s -w
  - <<: *build
    id: snmp
    main: ./plugins/snmp
    binary: plugins/currently-driver-snmp
    ldflags:
      - -s -w
  - <<: *build
    id: serial
    main: ./plugins/serial
    binary: plugins/currently-driver-serial
    ldflags:
      - -s -w

archives:
  - id: default
    ids: [currently, mqtt, snmp, serial]
    formats: [tar.gz]
    format_overrides:
      - { goos: windows, formats: [zip] }
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    files:
      - LICENSE
      - README.md
      - currently.example.yaml
      - src: packaging/linux/*
        dst: packaging/linux
      - src: packaging/freebsd/*
        dst: packaging/freebsd
      - src: packaging/macos/*
        dst: packaging/macos

nfpms:
  - id: packages
    ids: [currently, mqtt, snmp, serial]
    package_name: currently
    vendor: Currently
    homepage: https://github.com/duskglow/currently
    maintainer: Russell Miller <rmiller@duskglow.com>
    description: |-
      Easy UPS monitor and shutdown daemon.
      Currently monitors UPSes over USB and other drivers, shuts computers down
      safely on power failure, and serves UPS state over the NUT protocol,
      SNMP (UPS-MIB), Prometheus and a REST API.
    license: Apache-2.0
    section: admin
    formats: [deb, rpm, apk, archlinux]
    # The binaries go to /usr/lib/currently (Currently finds plugins in plugins/
    # next to itself), with /usr/bin/currently linking to it.
    bindir: /usr/lib/currently
    contents:
      - src: /usr/lib/currently/currently
        dst: /usr/bin/currently
        type: symlink
      - src: packaging/linux/currently.service
        dst: /usr/lib/systemd/system/currently.service
        file_info: { mode: 0644 }
      - src: packaging/linux/currently.openrc
        dst: /etc/init.d/currently
        packager: apk
        file_info: { mode: 0755 }
      - src: packaging/linux/90-currently-ups.rules
        dst: /usr/lib/udev/rules.d/90-currently-ups.rules
        file_info: { mode: 0644 }
      - src: packaging/linux/currently.default
        dst: /etc/default/currently
        type: config|noreplace
        file_info: { mode: 0600 }
      - dst: /etc/currently
        type: dir
        file_info: { mode: 0755 }
      - dst: /etc/currently/plugins.d
        type: dir
        file_info: { mode: 0755 }
      - src: currently.example.yaml
        dst: /usr/share/doc/currently/currently.example.yaml
        file_info: { mode: 0644 }
      - src: README.md
        dst: /usr/share/doc/currently/README.md
        file_info: { mode: 0644 }
      - src: LICENSE
        dst: /usr/share/doc/currently/LICENSE
        file_info: { mode: 0644 }
    scripts:
      postinstall: packaging/linux/postinstall.sh
      preremove: packaging/linux/preremove.sh
      postremove: packaging/linux/postremove.sh
    rpm:
      group: Applications/System
    deb:
      fields:
        Bugs: https://github.com/duskglow/currently/issues
    overrides:
      deb:
        recommends: [udev]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  # Keyless signing with the workflow's OIDC identity; verify with
  #   cosign verify-blob --bundle checksums.txt.sigstore.json \
  #     --certificate-identity-regexp 'github.com/duskglow/currently' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", --yes]

dockers_v2:
  - id: image
    ids: [currently, mqtt, snmp, serial]
    dockerfile: packaging/docker/Dockerfile
    images: [ghcr.io/duskglow/currently]
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64, linux/arm/v7]
    labels:
      org.opencontainers.image.source: https://github.com/duskglow/currently
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.description: Currently UPS monitor

homebrew_casks:
  - name: currently
    ids: [default]
    binaries: [currently]
    homepage: https://github.com/duskglow/currently
    description: Easy UPS monitor that serves NUT, SNMP, Prometheus and REST
    repository:
      owner: duskglow
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    skip_upload: auto
    caveats: |
      Set Currently up and run it as a service:
        sudo currently init
        sudo currently service install && sudo currently service start
      The binary is not notarized yet; if macOS refuses to run it:
        xattr -dr com.apple.quarantine "$(brew --prefix)/bin/currently"

winget:
  - name: Currently
    package_identifier: duskglow.Currently
    publisher: duskglow
    short_description: Easy UPS monitor that serves NUT, SNMP, Prometheus and REST
    license: Apache-2.0
    license_url: https://github.com/duskglow/currently/blob/main/LICENSE
    homepage: https://github.com/duskglow/currently
    ids: [default]
    skip_upload: auto
    repository:
      owner: duskglow
      name: winget-pkgs
      branch: "currently-{{ .Version }}"
      token: "{{ .Env.WINGET_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:"]

release:
  github:
    owner: duskglow
    name: currently
  prerelease: auto
  name_template: "Currently {{ .Tag }}"
  header: |
    {{ if .Prerelease }}**This is an alpha pre-release.** Every planned feature is built, but
    Currently has been tested with one model of UPS (CyberPower CP1500PFCLCD, on
    Windows and Linux) and much of it only against simulators. Run it alongside
    your current setup until you have watched it through a real power cut, and
    rehearse shutdowns with `currently test shutdown` first. Reports of what works
    with your UPS (and what doesn't) are very welcome; see the
    [README](https://github.com/duskglow/currently#supported-upses).{{ end }}
