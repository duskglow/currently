name: Release

# Push a v* tag to release: GoReleaser publishes the archives, Linux
# packages, container image, Homebrew cask and winget manifest; then the
# MSI and the FreeBSD package are built from the archives and attached.
#
# Secrets: HOMEBREW_TAP_TOKEN and WINGET_TOKEN (repository tokens for the
# tap and the winget-pkgs fork); without them those steps are skipped.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write # keyless cosign signatures

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

  msi:
    needs: goreleaser
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          gh release download ${{ github.ref_name }} --pattern "*_windows_amd64.zip" --dir dist
          Expand-Archive "dist\nutng_${v}_windows_amd64.zip" -DestinationPath dist\win
          packaging\windows\build-msi.ps1 -Version $v -BinDir dist\win -Out "dist\nutng_${v}_windows_amd64.msi"
          gh release upload ${{ github.ref_name }} "dist\nutng_${v}_windows_amd64.msi"

  freebsd-pkg:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download ${{ github.ref_name }} --pattern "*_freebsd_amd64.tar.gz" --dir dist
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          run: |
            v=$(echo "${{ github.ref_name }}" | sed 's/^v//')
            sh packaging/freebsd/make-pkg.sh "$v" "dist/nutng_${v}_freebsd_amd64.tar.gz" dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          cp dist/nutng-${v}.pkg dist/nutng_${v}_freebsd_amd64.pkg
          gh release upload ${{ github.ref_name }} dist/nutng_${v}_freebsd_amd64.pkg
