name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test -race ./...
        if: runner.os != 'Windows'
      - run: go test ./...
        if: runner.os == 'Windows'
      - name: USB transport without cgo (purego)
        if: runner.os == 'macOS'
        run: CGO_ENABLED=0 go test -count=1 ./drivers/usbhid/...

  freebsd:
    # The FreeBSD USB transport and the rest of the unit tests, in a VM.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "14.3"
          usesh: true
          prepare: pkg install -y go git
          run: |
            go version
            go vet ./drivers/usbhid/... ./outputs/... ./internal/...
            go test ./drivers/... ./outputs/... ./internal/config ./internal/core ./internal/policy

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - linux/arm
          - linux/386
          - freebsd/amd64
          - freebsd/arm64
          - darwin/amd64
          - darwin/arm64
          - windows/amd64
          - windows/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          CGO_ENABLED: "0"
          GOARM: "7"
        run: |
          export GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}"
          go build -o /dev/null ./cmd/currently

  plugins:
    # Plugins as separate processes, including the Python SDK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r internal/scaffold/templates/python/requirements.txt
      - run: CURRENTLY_TEST_PYTHON=$(which python) go test ./internal/plugins ./internal/scaffold ./plugins/...
      - run: for p in mqtt snmp serial; do go build -o /dev/null ./plugins/$p; done

  generated:
    # gen/ and the Python SDK must match proto/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install grpcio-tools==1.85.0
      - run: PYTHON=python bash scripts/gen.sh
      - run: git diff --exit-code -- gen internal/scaffold/python examples/plugins

  nut-integration:
    # Against the real NUT: upsc/upscmd/upsrw/upsmon clients, and a
    # cross-machine shutdown rehearsal with upsmon and upsd. Shutdown
    # commands only write marker files, and CURRENTLY_NEVER_SHUTDOWN is set.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: |
          sudo apt-get update && sudo apt-get install -y nut-client nut-server
          dpkg -L nut-client nut-server | grep -E '/(upsc|upsmon|upsd|dummy-ups)$'
      - run: go build -o currently ./cmd/currently
      - run: bash test/integration/nut-clients.sh ./currently
      - run: bash test/integration/shutdown.sh ./currently

  snmp-integration:
    # The SNMP agent against net-snmp's snmpget/snmpwalk and snmptrapd.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y snmp snmptrapd
      - run: go build -o currently ./cmd/currently
      - run: bash test/integration/snmp.sh ./currently

  packaging:
    # A snapshot release (archives and Linux packages), then the .deb
    # installed and started for real.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=docker,sign,sbom
      - name: Install the .deb
        run: |
          sudo mkdir -p /etc/currently
          printf 'ups:\n  sim: {driver: simulator}\nlisten:\n  snmp: 127.0.0.1:1161\n' | sudo tee /etc/currently/currently.yaml
          sudo dpkg -i dist/currently_*_linux_amd64.deb
          sleep 3
          systemctl is-active currently
          currently status
          currently plugin list | grep -c -E "mqtt|snmp|serial" | grep -qx 3
          sudo dpkg -r currently
          ! systemctl is-active currently
      - uses: actions/upload-artifact@v7
        with:
          name: snapshot
          path: dist/*_windows_amd64.zip

  msi:
    needs: packaging
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: snapshot
          path: dist
      - shell: pwsh
        run: |
          Expand-Archive (Get-ChildItem dist\*_windows_amd64.zip).FullName -DestinationPath dist\win
          packaging/windows/build-msi.ps1 -Version 0.0.1 -BinDir dist/win -Out dist/currently.msi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: true
          breaking: false
          push: false
