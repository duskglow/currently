name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
        if: runner.os != 'Windows'
      - run: go test ./...
        if: runner.os == 'Windows'

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - linux/amd64
          - linux/arm64
          - linux/arm
          - freebsd/amd64
          - darwin/arm64
          - windows/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          CGO_ENABLED: "0"
          GOARM: "7"
        run: |
          export GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}"
          go build -o /dev/null ./cmd/nutng

  plugins:
    # Plugins as separate processes, including the Python SDK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r internal/scaffold/templates/python/requirements.txt
      - run: NUTNG_TEST_PYTHON=$(which python) go test ./internal/plugins ./internal/scaffold ./plugins/...
      - run: go build -o /dev/null ./plugins/mqtt

  generated:
    # gen/ and the Python SDK must match proto/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install grpcio-tools==1.85.0
      - run: PYTHON=python bash scripts/gen.sh
      - run: git diff --exit-code -- gen internal/scaffold/python examples/plugins

  nut-integration:
    # Against the real NUT: upsc/upscmd/upsrw/upsmon clients, and a
    # cross-machine shutdown rehearsal with upsmon and upsd. Shutdown
    # commands only write marker files, and NUTNG_NEVER_SHUTDOWN is set.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y nut-client nut-server
      - run: go build -o nutng ./cmd/nutng
      - run: bash test/integration/nut-clients.sh ./nutng
      - run: bash test/integration/shutdown.sh ./nutng

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: true
          breaking: false
          push: false
