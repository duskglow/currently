# Typical NUT ups.conf
maxretry = 3

[rack]
	driver = usbhid-ups
	port = auto
	desc = "Rack UPS (APC)"
	vendorid = 051D
	productid = 0002
	serial = "3B1234X56789"
	pollinterval = 5

[closet]
	driver = snmp-ups
	port = 192.168.1.20
	community = public
	mibs = apcc
	pollfreq = 15

[serial]
	driver = blazer_ser
	port = /dev/ttyS0
	desc = "Basement UPS"
	default.battery.voltage.low = 21.0
	default.battery.voltage.high = 26.0

[apc]
	driver = apcsmart
	port = /dev/ttyS1

[usbq]
	driver = nutdrv_qx
	port = auto

[old]
	driver = bcmxcp
	port = /dev/ttyS2

[test]
	driver = dummy-ups
	port = dummy.dev
