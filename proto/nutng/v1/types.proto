syntax = "proto3";

// Shared types for the nut-ng plugin protocol. They mirror the Go types in
// pkg/sdk; see that package for field semantics.
package nutng.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/nut-ng/nut-ng/gen/nutng/v1;nutngv1";

enum PluginKind {
  PLUGIN_KIND_UNSPECIFIED = 0;
  PLUGIN_KIND_DRIVER = 1;
  PLUGIN_KIND_OUTPUT = 2;
}

message PluginInfo {
  string name = 1;
  PluginKind kind = 2;
  string version = 3;
  string description = 4;
  // JSON Schema for the plugin's block in nutng.yaml, used by
  // `nutng config validate` and editor autocomplete.
  string config_schema = 5;
  // Must equal the core's sdk.ProtocolVersion.
  uint32 protocol_version = 6;
}

message Variable {
  string name = 1;
  string value = 2;
  string unit = 3;
  bool writable = 4;
  google.protobuf.Timestamp updated = 5;
}

message Command {
  string name = 1;
  string description = 2;
}

enum ConnState {
  CONN_STATE_UNSPECIFIED = 0;
  CONN_STATE_CONNECTING = 1;
  CONN_STATE_CONNECTED = 2;
  CONN_STATE_STALE = 3;
  CONN_STATE_FAILED = 4;
}

message UPS {
  string name = 1;
  string description = 2;
  string driver = 3;
  ConnState state = 4;
  string last_error = 5;
  google.protobuf.Timestamp last_update = 6;
  int32 restarts = 7;
  map<string, Variable> vars = 8;
  repeated Command commands = 9;
}

message Event {
  uint64 seq = 1;
  google.protobuf.Timestamp time = 2;
  string ups = 3;
  // One of the sdk.EventType values ("on_battery", "comm_lost", ...).
  // Kept as a string so new event types do not break older plugins.
  string type = 4;
  string message = 5;
  map<string, string> changed = 6;
}

message Sample {
  google.protobuf.Timestamp time = 1;
  double value = 2;
}
