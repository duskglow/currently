syntax = "proto3";

// Driver plugins read UPS hardware and report variables to the core.
// An executable named currently-driver-<name> serves DriverService over
// gRPC, started the hashicorp/go-plugin way: it checks the magic cookie
// environment variable, listens on 127.0.0.1, serves the gRPC health
// service for "plugin", and prints "1|1|tcp|<address>|grpc" on stdout.
// The core adapts it to sdk.Driver and sdk.Device.
package currently.v1;

import "currently/v1/types.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/duskglow/currently/gen/currently/v1;currentlyv1";

service DriverService {
  // Describes the plugin. Called once after the handshake.
  rpc DescribeDriver(DescribeDriverRequest) returns (DescribeDriverResponse);
  // Checks a UPS block's options without touching hardware.
  rpc ValidateDriverConfig(ValidateDriverConfigRequest) returns (ValidateDriverConfigResponse);
  // Lists devices found without configuration.
  rpc DiscoverDevices(DiscoverDevicesRequest) returns (DiscoverDevicesResponse);
  // Opens one device. A plugin process may hold several open devices.
  rpc OpenDevice(OpenDeviceRequest) returns (OpenDeviceResponse);
  // Streams variable updates until the core cancels the call or the device
  // fails. Ending the stream makes the core close and reopen the device.
  rpc WatchDevice(WatchDeviceRequest) returns (stream WatchDeviceResponse);
  rpc RunCommand(RunCommandRequest) returns (RunCommandResponse);
  rpc SetVar(SetVarRequest) returns (SetVarResponse);
  rpc CloseDevice(CloseDeviceRequest) returns (CloseDeviceResponse);
}

message DescribeDriverRequest {}

message DescribeDriverResponse {
  PluginInfo info = 1;
}

message ValidateDriverConfigRequest {
  google.protobuf.Struct config = 1;
}

message ValidateDriverConfigResponse {
  // Empty when the config is valid.
  repeated string errors = 1;
}

message DiscoverDevicesRequest {}

message DiscoveredDevice {
  string id = 1;
  string description = 2;
  // Options that select this device in a UPS block.
  google.protobuf.Struct config = 3;
}

message DiscoverDevicesResponse {
  repeated DiscoveredDevice devices = 1;
}

message OpenDeviceRequest {
  // The UPS name from the config file, for log messages.
  string ups = 1;
  google.protobuf.Struct config = 2;
}

message OpenDeviceResponse {
  // Handle for the other device calls.
  string device_id = 1;
  repeated Command commands = 2;
  repeated string writable = 3;
}

message WatchDeviceRequest {
  string device_id = 1;
}

message WatchDeviceResponse {
  map<string, string> vars = 1;
  repeated string removed = 2;
}

message RunCommandRequest {
  string device_id = 1;
  string command = 2;
  string param = 3;
}

message RunCommandResponse {}

message SetVarRequest {
  string device_id = 1;
  string name = 2;
  string value = 3;
}

message SetVarResponse {}

message CloseDeviceRequest {
  string device_id = 1;
}

message CloseDeviceResponse {}
